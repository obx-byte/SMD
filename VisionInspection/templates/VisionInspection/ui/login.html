<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee sign in</title><style>body{font:16px system-ui;background:#eef2f7;color:#102039;min-height:100vh;display:grid;place-items:center;margin:0}.login{background:#fff;width:min(420px,calc(100% - 32px));padding:32px;border:1px solid #d7e0eb;border-radius:14px;box-shadow:0 12px 36px #1b35501a}h1{margin:0 0 8px}.muted{color:#596b80}label{display:block;font-weight:650;margin:18px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #b7c6d8;border-radius:8px;font:inherit}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:8px;background:#123566;color:white;font:700 16px system-ui;cursor:pointer}.error{padding:10px;background:#fff0f0;color:#9b1c1c;border-radius:8px;margin-top:16px}</style></head><body><main class="login"><h1>Airbag Stitch Inspection</h1><p class="muted">Sign in with your Employee ID.</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="username">Employee ID</label><input id="username" name="username" autocomplete="username" required autofocus value="{{ request.POST.username|default:'' }}"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main><script>try { sessionStorage.removeItem("viInspectionWorkflow"); Object.keys(localStorage).forEach(function(key) { if (key.indexOf("vi-user-") === 0) localStorage.removeItem(key); }); } catch (error) { /* Storage may be disabled. */ }</script></body></html>
